<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Метеостанция</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/dashboard.css">
  <script defer src="/static/vendor/chart.umd.min.js"></script>
  <script defer src="/static/dashboard.js"></script>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Метеостанция</h1>
      <p id="status" role="status">Загрузка истории…</p>
    </div>
    <label for="period">Период
      <select id="period">
        <option value="1h" selected>1 час</option>
        <option value="6h">6 часов</option>
        <option value="24h">24 часа</option>
        <option value="7d">7 дней</option>
        <option value="30d">30 дней</option>
        <option value="90d">90 дней</option>
        <option value="180d">180 дней</option>
        <option value="1y">1 год</option>
      </select>
    </label>
  </header>
  <div class="charts">
    <section><h2>Температура, °C</h2><div class="canvas"><canvas id="temperature" aria-label="Температура" role="img"></canvas></div></section>
    <section><h2>Влажность, %</h2><div class="canvas"><canvas id="humidity" aria-label="Влажность" role="img"></canvas></div></section>
    <section><h2>Давление, мм рт. ст.</h2><div class="canvas"><canvas id="pressure" aria-label="Давление" role="img"></canvas></div></section>
    <section><h2>CO₂, ppm</h2><div class="canvas"><canvas id="co2" aria-label="Концентрация CO₂" role="img"></canvas></div></section>
  </div>
</main>
</body>
</html>
